name: carsharing

x-backend: &backend
  image: carsharing-backend:local
  build:
    context: .
    dockerfile: infra/backend.Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-database: &database
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: carsharing

services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    platform: linux/amd64
    environment:
      POSTGRES_DB: carsharing
      POSTGRES_USER: carsharing_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password, db_app_password, mailstub_app_password]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/20-app-role.sql:/docker-entrypoint-initdb.d/20-app-role.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U carsharing_migrator -d carsharing -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  migrate:
    <<: *backend
    entrypoint: [/usr/local/bin/migrate]
    environment:
      <<: *database
      DB_USER: carsharing_migrator
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    environment:
      <<: *database
      DB_USER: carsharing_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      # The signed cursors of the collection reads this process serves are issued under this key.
      CURSOR_HMAC_KEY_FILE: /run/secrets/cursor_hmac_key
      # The internal surface is called with one token per capability: the simulator advances the
      # fleet, and the demonstration control moves a vehicle or decides a payment by hand.
      SIMULATOR_TOKEN_FILE: /run/secrets/simulator_token
      DEMO_CONTROL_TOKEN_FILE: /run/secrets/demo_control_token
      # The demonstration telemetry source stands in for vehicles that exist only here, so it runs
      # under this profile and nowhere else.
      APP_ENV: demo
      # The local environment and CI export the same values to the service and its acceptance
      # process. Changing one here is how a suite proves the running service reads configuration
      # rather than a compiled constant.
      RATE_LIMIT_SIGNIN_EMAIL_ADDRESS_ATTEMPTS: ${RATE_LIMIT_SIGNIN_EMAIL_ADDRESS_ATTEMPTS:-}
      RATE_LIMIT_SIGNIN_EMAIL_ATTEMPTS: ${RATE_LIMIT_SIGNIN_EMAIL_ATTEMPTS:-}
      RATE_LIMIT_SIGNIN_ADDRESS_ATTEMPTS: ${RATE_LIMIT_SIGNIN_ADDRESS_ATTEMPTS:-}
      RATE_LIMIT_REGISTRATION_ADDRESS_ATTEMPTS: ${RATE_LIMIT_REGISTRATION_ADDRESS_ATTEMPTS:-}
      RATE_LIMIT_SIGNIN_EMAIL_ADDRESS_WINDOW: ${RATE_LIMIT_SIGNIN_EMAIL_ADDRESS_WINDOW:-}
      RATE_LIMIT_SIGNIN_EMAIL_WINDOW: ${RATE_LIMIT_SIGNIN_EMAIL_WINDOW:-}
      RATE_LIMIT_SIGNIN_ADDRESS_WINDOW: ${RATE_LIMIT_SIGNIN_ADDRESS_WINDOW:-}
      RATE_LIMIT_REGISTRATION_ADDRESS_WINDOW: ${RATE_LIMIT_REGISTRATION_ADDRESS_WINDOW:-}
      # The origins a mutating request may come from, counted from the port the frontend is published
      # on: a browser sends the port it reached the application on, so a list naming another one
      # refuses the application itself. That port is stated once, in the frontend's mapping below.
      ALLOWED_ORIGINS: http://127.0.0.1:${APP_PORT:-8080},http://localhost:${APP_PORT:-8080}
    secrets: [db_app_password, cursor_hmac_key, simulator_token, demo_control_token]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, ready]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s

  # The clock of the simulated fleet: it calls the internal tick operation of the API once a second,
  # so the model is advanced by a process of its own and stopping it leaves every vehicle standing
  # exactly where the last tick left it. It reaches the API over the internal network, where the
  # external proxy does not publish /internal.
  #
  # Starting it is a deliberate act, like installing the demonstration: a stack that is merely running
  # leaves the fleet where the seed or the last restoration put it, and the demonstration is driven by
  # commands. `docker compose --profile demo up --detach simulator` starts it.
  simulator:
    <<: *backend
    profiles: [demo]
    entrypoint: [/usr/local/bin/simulator]
    environment:
      INTERNAL_API_URL: http://api:8080
      SIMULATOR_TOKEN_FILE: /run/secrets/simulator_token
    secrets: [simulator_token]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 15s

  # The background work of the backend: outbox delivery, the reservation deadline sweep and the
  # retention of delivered signals. It is a separate process so that restarting either it or the API
  # leaves the other serving; both use the same modules.
  #
  # It delivers the letter with an invoice to the mail stub, so it is given that address and the
  # delivery token alone: the process that sends a letter is not thereby allowed to arm the loss of an
  # answer, which is what the other capability of the stub is for.
  worker:
    <<: *backend
    entrypoint: [/usr/local/bin/worker]
    environment:
      <<: *database
      DB_USER: carsharing_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      MAILSTUB_API_URL: http://mailstub:8080
      MAILSTUB_DELIVERY_TOKEN_FILE: /run/secrets/mailstub_delivery_token
    secrets: [db_app_password, mailstub_delivery_token]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailstub: { condition: service_healthy }
    # This process serves nothing, so its probe reads the mark it writes to /tmp: a worker that hangs
    # stops marking and is shown as unhealthy, which a running container otherwise never says.
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, heartbeat]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s

  # The mail stub: it accepts one letter per delivery key into a schema of its own, arms the loss of an
  # answer when a demonstration asks for it, and shows what it received.
  #
  # Two listeners, one process. The internal one carries the contract's internal operations and is
  # reachable from this network alone: the external proxy answers every path under /internal with an
  # unknown resource, and this service publishes no port for it. The inbox is published on the loopback
  # address of the machine, on the port the process already listens on by default, so a person can read
  # what arrived without the box being on any network.
  mailstub:
    <<: *backend
    entrypoint: [/usr/local/bin/mailstub]
    environment:
      <<: *database
      DB_USER: mailstub_app
      DB_PASSWORD_FILE: /run/secrets/mailstub_app_password
      MAILSTUB_DELIVERY_TOKEN_FILE: /run/secrets/mailstub_delivery_token
      MAILSTUB_DEMO_TOKEN_FILE: /run/secrets/mailstub_demo_token
      MAILSTUB_CURSOR_HMAC_KEY_FILE: /run/secrets/mailstub_cursor_hmac_key
      # The demonstration control is served only under this profile, as it is in the API.
      APP_ENV: demo
    secrets: [mailstub_app_password, mailstub_delivery_token, mailstub_demo_token, mailstub_cursor_hmac_key]
    ports: ["127.0.0.1:8025:8025"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, ready]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s

  frontend:
    image: carsharing-frontend:local
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      target: runtime
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  seed:
    <<: *backend
    profiles: [demo]
    entrypoint: [/usr/local/bin/seed]
    environment:
      <<: *database
      APP_ENV: demo
      DB_USER: carsharing_migrator
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
      DEMO_USER_PASSWORD_FILE: /run/secrets/demo_user_password
    secrets: [db_admin_password, demo_user_password]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Restoring the prepared scenario is a separate deliberate command, never part of starting the
  # stack: a restart must leave the demonstration exactly where the last person left it.
  demo-scenario:
    <<: *backend
    profiles: [demo]
    entrypoint: [/usr/local/bin/demoscenario]
    environment:
      <<: *database
      APP_ENV: demo
      DB_USER: carsharing_migrator
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # The demonstration control, run one command at a time: it carries a set-to-value change to the
  # internal API under the token of its own capability, and changes nothing itself.
  #
  #   docker compose --profile demo run --rm democontrol set-energy-remaining \
  #     --vehicle <id> --source battery --remaining 5
  #
  # One of its commands belongs to the mail stub rather than to the API — arming the loss of the next
  # answer — so it is given that address and that capability too, and neither client can call the other
  # surface.
  democontrol:
    <<: *backend
    profiles: [demo]
    entrypoint: [/usr/local/bin/democontrol]
    environment:
      INTERNAL_API_URL: http://api:8080
      DEMO_CONTROL_TOKEN_FILE: /run/secrets/demo_control_token
      MAILSTUB_API_URL: http://mailstub:8080
      MAILSTUB_DEMO_TOKEN_FILE: /run/secrets/mailstub_demo_token
    secrets: [demo_control_token, mailstub_demo_token]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:

secrets:
  db_admin_password:
    file: ./.secrets/db_admin_password
  db_app_password:
    file: ./.secrets/db_app_password
  mailstub_app_password:
    file: ./.secrets/mailstub_app_password
  cursor_hmac_key:
    file: ./.secrets/cursor_hmac_key
  simulator_token:
    file: ./.secrets/simulator_token
  demo_control_token:
    file: ./.secrets/demo_control_token
  mailstub_delivery_token:
    file: ./.secrets/mailstub_delivery_token
  mailstub_demo_token:
    file: ./.secrets/mailstub_demo_token
  mailstub_cursor_hmac_key:
    file: ./.secrets/mailstub_cursor_hmac_key
  demo_user_password:
    file: ./.secrets/demo_user_password
