{{define "inboxLayout"}}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}}</title>
    <style>
      {{.Styles}}
    </style>
  </head>
  <body>
    <main class="inbox">
      <header class="inbox-header">
        <h1 class="inbox-name">{{.Title}}</h1>
        <p class="inbox-summary">{{.Summary}}</p>
      </header>
      {{.Content}}
      <footer class="inbox-footer">
        {{if .Letter}}
          <a href="/">{{.Labels.BackToList}}</a>
        {{else}}
          <a href="{{.Current}}">{{.Labels.Refresh}}</a>
        {{end}}
        <a href="{{.JSON}}">{{.Labels.JSON}}</a>
      </footer>
    </main>
  </body>
</html>
{{end}}
