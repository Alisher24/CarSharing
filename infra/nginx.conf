server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        client_max_body_size 64k;
        error_page 413 = @body_too_large;
        error_page 502 503 504 = @api_unavailable;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location ~ ^/(health|internal)(/|$) {
        include /etc/nginx/error-json.conf;
        return 404 '{"code":"RESOURCE_NOT_FOUND","message":"Resource not found","request_id":"$request_id"}';
    }
    location @body_too_large {
        include /etc/nginx/error-json.conf;
        return 413 '{"code":"BODY_TOO_LARGE","message":"Request body is too large","request_id":"$request_id"}';
    }
    location @api_unavailable {
        include /etc/nginx/error-json.conf;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Service unavailable","request_id":"$request_id"}';
    }
    location /assets/ { try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
