server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # Text the browser has to receive whole is sent compressed. The basemap archive is deliberately
    # absent: it already holds compressed tiles, and compressing it would break the range requests it
    # is read with.
    gzip on;
    gzip_proxied any;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/x-protobuf;

    location /api/ {
        client_max_body_size 64k;
        error_page 413 = @body_too_large;
        error_page 502 503 504 = @api_unavailable;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location ~ ^/(health|internal)(/|$) {
        include /etc/nginx/error-json.conf;
        return 404 '{"code":"RESOURCE_NOT_FOUND","message":"Resource not found","request_id":"$request_id"}';
    }
    location @body_too_large {
        include /etc/nginx/error-json.conf;
        return 413 '{"code":"BODY_TOO_LARGE","message":"Request body is too large","request_id":"$request_id"}';
    }
    location @api_unavailable {
        include /etc/nginx/error-json.conf;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Service unavailable","request_id":"$request_id"}';
    }
    location /assets/ { try_files $uri =404; }

    # The archive, the glyphs and the sprite of the basemap, from the same files as any other static
    # asset. The longest matching prefix wins over `location /` below, so a glyph that is not there
    # answers 404 rather than the application in HTML, which a font parser would refuse without
    # saying why.
    #
    # A `types` block here would replace the whole map the server was given rather than add to it, and
    # a sprite would then be served as an unknown type and sent uncompressed. The two types this
    # location adds are therefore written beside the ones the server already knows.
    location /basemap/ {
        include /etc/nginx/mime.types;
        types {
            application/x-protobuf pbf;
            application/octet-stream pmtiles;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location / { expires -1; try_files $uri $uri/ /index.html; }
}
