package: servedapi
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output: internal/contracts/servedapi/generated.go
output-options:
  include-operation-ids:
    - getHealthLive
    - getHealthReady
    - register
    - login
    - logout
    - getMe
    - getVehicles
    - getVehicle
    - getZones
    - getTariffs
    - getCurrentRental
    - reserve
    - cancelRental
    # The three ride commands: start, pause and resume. Finishing a ride is a later task, so it stays
    # out of the served set until its own operation is implemented.
    - startRental
    - pauseRental
    - resumeRental
    - getNotifications
    - readNotification
    # The two streams are served here too: the boundary validates them against the contract, and the
    # generated streaming response writes the frames as they are produced.
    - getPublicEvents
    - getPrivateEvents
