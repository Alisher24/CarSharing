package: servedapi
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output: internal/contracts/servedapi/generated.go
output-options:
  include-operation-ids:
    - getHealthLive
    - getHealthReady
    - register
    - login
    - logout
    - getMe
    - getVehicles
    - getVehicle
    - getZones
    - getTariffs
    - getCurrentRental
    - reserve
    - cancelRental
    # The ride commands: start, pause, resume and the finish that ends the ride and issues its
    # invoice.
    - startRental
    - pauseRental
    - resumeRental
    - finishRental
    - getNotifications
    - readNotification
    # The two streams are served here too: the boundary validates them against the contract, and the
    # generated streaming response writes the frames as they are produced.
    - getPublicEvents
    - getPrivateEvents
