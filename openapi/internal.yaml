              examples:
                BODY_TOO_LARGE:
                  value:
                    code: BODY_TOO_LARGE
                    message: Request could not be completed
                    request_id: example-request-1
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          x-error-codes:
            - UNSUPPORTED_MEDIA_TYPE
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
