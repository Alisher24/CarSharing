            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                SERVICE_UNAVAILABLE:
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: Request could not be completed
                    request_id: example-request-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoAction'
            examples:
              set_telemetry_state:
                value:
                  action_id: 11111111-1111-4111-8111-111111111111
                  action: set_telemetry_state
                  vehicle_id: 01994342-6ba7-7000-8000-000000000001
                  telemetry_state: offline
              set_position:
                value:
                  action_id: 11111111-1111-4111-8111-111111111111
                  action: set_position
                  vehicle_id: 01994342-6ba7-7000-8000-000000000001
                  position:
                    type: Point
                    coordinates:
                      - 74.6
                      - 42.87
              set_energy_remaining:
                value:
                  action_id: 11111111-1111-4111-8111-111111111111
                  action: set_energy_remaining
                  vehicle_id: 01994342-6ba7-7000-8000-000000000001
                  source_kind: battery
                  remaining: '0'
              mark_serviced:
                value:
                  action_id: 11111111-1111-4111-8111-111111111111
                  action: mark_serviced
                  vehicle_id: 01994342-6ba7-7000-8000-000000000001
              set_next_payment_outcome:
                value:
                  action_id: 11111111-1111-4111-8111-111111111111
                  action: set_next_payment_outcome
                  rental_id: 01994342-6ba7-7000-8000-000000000001
                  outcome: failed
      security:
        - DemoToken: []
components:
  headers:
    CacheControl:
      description: Responses must not be cached.
      schema:
        type: string
        enum:
          - no-store
    IdempotencyReplayed:
      description: true only for a replay of the saved original status and body.
      schema:
        type: boolean
    RequestId:
      description: Identifier of this HTTP attempt. Replays retain the original body request_id.
      schema:
        $ref: ./components/identifiers.yaml#/components/schemas/RequestId
    RetryAfter:
      description: Retry after one second for an in-flight command.
      schema:
        type: integer
        enum:
          - 1
  schemas:
    ApiError:
      $ref: ./components/errors.yaml#/components/schemas/ApiError
    Point:
      type: object
      additionalProperties: false
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
        coordinates:
          $ref: '#/components/schemas/Position'
    Position:
      type: array
      items:
        type: number
        minimum: -180
        maximum: 180
      minItems: 2
      maxItems: 2
      description: WGS84 [longitude, latitude]. Latitude must be within -90..90.
      x-coordinate-order: longitude-latitude
    SourceKind:
      type: string
      enum:
        - battery
        - gasoline
        - diesel
        - lpg
        - cng
    TickRequest:
      type: object
      additionalProperties: false
      required:
        - tick_id
      properties:
        tick_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
    TickResult:
      type: object
      additionalProperties: false
      required:
        - tick_id
        - server_time
        - processed_at
        - changed_vehicle_ids
        - completed_rental_ids
      properties:
        tick_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        server_time:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
        processed_at:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
        changed_vehicle_ids:
          type: array
          items:
            $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        completed_rental_ids:
          type: array
          items:
            $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
    SetTelemetryState:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action
        - vehicle_id
        - telemetry_state
      properties:
        action_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        action:
          type: string
          enum:
            - set_telemetry_state
        vehicle_id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        telemetry_state:
          type: string
          enum:
            - online
            - offline
      example:
        action_id: 11111111-1111-4111-8111-111111111111
        action: set_telemetry_state
        vehicle_id: 01994342-6ba7-7000-8000-000000000001
        telemetry_state: offline
    SetPosition:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action
        - vehicle_id
        - position
      properties:
        action_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        action:
          type: string
          enum:
            - set_position
        vehicle_id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        position:
          $ref: '#/components/schemas/Point'
      example:
        action_id: 11111111-1111-4111-8111-111111111111
        action: set_position
        vehicle_id: 01994342-6ba7-7000-8000-000000000001
        position:
          type: Point
          coordinates:
            - 74.6
            - 42.87
    SetEnergyRemaining:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action
        - vehicle_id
        - source_kind
        - remaining
      properties:
        action_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        action:
          type: string
          enum:
            - set_energy_remaining
        vehicle_id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        remaining:
          $ref: ./components/common.yaml#/components/schemas/EnergyDecimal
      example:
        action_id: 11111111-1111-4111-8111-111111111111
        action: set_energy_remaining
        vehicle_id: 01994342-6ba7-7000-8000-000000000001
        source_kind: battery
        remaining: '0'
    MarkServiced:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action
        - vehicle_id
      properties:
        action_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        action:
          type: string
          enum:
            - mark_serviced
        vehicle_id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
      example:
        action_id: 11111111-1111-4111-8111-111111111111
        action: mark_serviced
        vehicle_id: 01994342-6ba7-7000-8000-000000000001
    SetNextPaymentOutcome:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action
        - rental_id
        - outcome
      properties:
        action_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        action:
          type: string
          enum:
            - set_next_payment_outcome
        rental_id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        outcome:
          type: string
          enum:
            - paid
            - failed
      example:
        action_id: 11111111-1111-4111-8111-111111111111
        action: set_next_payment_outcome
        rental_id: 01994342-6ba7-7000-8000-000000000001
        outcome: failed
    DemoAction:
      oneOf:
        - $ref: '#/components/schemas/SetTelemetryState'
        - $ref: '#/components/schemas/SetPosition'
        - $ref: '#/components/schemas/SetEnergyRemaining'
        - $ref: '#/components/schemas/MarkServiced'
        - $ref: '#/components/schemas/SetNextPaymentOutcome'
      discriminator:
        propertyName: action
        mapping:
          set_telemetry_state: '#/components/schemas/SetTelemetryState'
          set_position: '#/components/schemas/SetPosition'
          set_energy_remaining: '#/components/schemas/SetEnergyRemaining'
          mark_serviced: '#/components/schemas/MarkServiced'
          set_next_payment_outcome: '#/components/schemas/SetNextPaymentOutcome'
    DemoResult:
      type: object
      additionalProperties: false
      required:
        - action_id
        - server_time
      properties:
        action_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        server_time:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
  securitySchemes:
    SimulatorToken:
      type: http
      scheme: bearer
      description: simulator_token
    DemoToken:
      type: http
      scheme: bearer
      description: demo_control_token
