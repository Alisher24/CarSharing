              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                VALIDATION_FAILED:
                  value:
                    code: VALIDATION_FAILED
                    message: Request could not be completed
                    request_id: example-request-1
                    details:
                      violations:
                        - location: body
                          pointer: /email
                          code: required
