                    code: MALFORMED_JSON
                    message: Request could not be completed
                    request_id: example-request-1
        '401':
          description: INTERNAL_AUTHENTICATION_REQUIRED
          x-error-codes:
            - INTERNAL_AUTHENTICATION_REQUIRED
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INTERNAL_AUTHENTICATION_REQUIRED:
                  value:
                    code: INTERNAL_AUTHENTICATION_REQUIRED
                    message: Request could not be completed
                    request_id: example-request-1
        '404':
          description: RESOURCE_NOT_FOUND
