openapi: 3.0.3
info:
  title: CarSharing mailstub delivery and read-only inbox
  version: 1.0.0
  description: >-
    Planned MVP contract; no production handlers. JSON responses use Cache-Control no-store. Only local schema
    references are allowed. Separate listeners: internal delivery/fault control inside the container network;
    anonymous read-only inbox on http://127.0.0.1:8025 with no CORS, create, delete or reset. Internal bodies
    are limited to 262144 bytes. Check the capability-specific bearer token before domain payload;
    missing/invalid both return INTERNAL_AUTHENTICATION_REQUIRED. Exactly one receiver record per delivery
    key; the worker sends after commit of invoice/outbox, independently of payment. Payment retries do not
    create a second completion email. Unsupported methods are 405 METHOD_NOT_ALLOWED with Allow;
    unknown/foreign resources and unimplemented production paths are 404 RESOURCE_NOT_FOUND. Errors use
    ApiError, X-Request-ID and no-store. Syntax/header errors are 400; parsed field errors are 422. Validation
    details enumerate all independently detectable violations in deterministic body/query/path/header and
    pointer/parameter order.
paths:
  /internal/v1/messages:
    post:
      operationId: deliverMessage
      summary: deliver Message
      x-implementation-status: implemented
      x-body-limit: 262144
      description: >-
        Atomically store delivery key, exact content and stable receipt. Same key/body replays original 201
        receipt with Idempotency-Replayed true; another body returns DELIVERY_CONFLICT. HTML fields are not
        accepted. Request body is required.
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            $ref: ./components/identifiers.yaml#/components/schemas/RequestId
        - name: Delivery-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^invoice:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}:issued$
      responses:
        '201':
          description: Created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryReceipt'
              example:
                id: 01994342-6ba7-7000-8000-000000000001
                accepted_at: '2026-09-12T07:15:30.123456Z'
        '400':
          description: INVALID_HEADER, MALFORMED_JSON
          x-error-codes:
            - INVALID_HEADER
            - MALFORMED_JSON
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVALID_HEADER:
                  value:
                    code: INVALID_HEADER
                    message: Request could not be completed
                    request_id: example-request-1
                MALFORMED_JSON:
                  value:
                    code: MALFORMED_JSON
                    message: Request could not be completed
                    request_id: example-request-1
        '401':
          description: INTERNAL_AUTHENTICATION_REQUIRED
          x-error-codes:
            - INTERNAL_AUTHENTICATION_REQUIRED
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INTERNAL_AUTHENTICATION_REQUIRED:
                  value:
                    code: INTERNAL_AUTHENTICATION_REQUIRED
                    message: Request could not be completed
                    request_id: example-request-1
        '409':
          description: DELIVERY_CONFLICT
          x-error-codes:
            - DELIVERY_CONFLICT
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                DELIVERY_CONFLICT:
                  value:
                    code: DELIVERY_CONFLICT
                    message: Request could not be completed
                    request_id: example-request-1
        '413':
          description: BODY_TOO_LARGE
          x-error-codes:
            - BODY_TOO_LARGE
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                BODY_TOO_LARGE:
                  value:
                    code: BODY_TOO_LARGE
                    message: Request could not be completed
                    request_id: example-request-1
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          x-error-codes:
            - UNSUPPORTED_MEDIA_TYPE
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                UNSUPPORTED_MEDIA_TYPE:
                  value:
                    code: UNSUPPORTED_MEDIA_TYPE
                    message: Request could not be completed
                    request_id: example-request-1
        '422':
          description: VALIDATION_FAILED
          x-error-codes:
            - VALIDATION_FAILED
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                VALIDATION_FAILED:
                  value:
                    code: VALIDATION_FAILED
                    message: Request could not be completed
                    request_id: example-request-1
                    details:
                      violations:
                        - location: body
                          pointer: /email
                          code: required
                          message: Required value is missing
        '500':
          description: INTERNAL_ERROR
          x-error-codes:
            - INTERNAL_ERROR
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INTERNAL_ERROR:
                  value:
                    code: INTERNAL_ERROR
                    message: Request could not be completed
                    request_id: example-request-1
        '503':
          description: SERVICE_UNAVAILABLE
          x-error-codes:
            - SERVICE_UNAVAILABLE
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                SERVICE_UNAVAILABLE:
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: Request could not be completed
                    request_id: example-request-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
            example:
              to: user@example.test
              subject: Invoice issued
              text: 'Ride completed: user_finished. Total: 3000 tyiyn.'
      security:
        - DeliveryToken: []
      x-listener: internal
