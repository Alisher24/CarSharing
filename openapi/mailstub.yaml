  /api/v1/messages:
    get:
      operationId: getMessages
      summary: get Messages
      x-implementation-status: implemented
      x-body-limit: 0
      description: >-
        Read-only anonymous localhost inbox. Order (accepted_at DESC, id DESC), forward only. Cursor uses a
        dedicated mailstub HMAC key and binds resource/query scope. No request body is permitted, including an
        empty JSON object.
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            $ref: ./components/identifiers.yaml#/components/schemas/RequestId
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            $ref: ./components/common.yaml#/components/schemas/Cursor
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCollection'
              example:
                items:
                  - id: 01994342-6ba7-7000-8000-000000000001
                    accepted_at: '2026-09-12T07:15:30.123456Z'
                    to: user@example.test
                    subject: Invoice issued
                next_cursor: null
        '400':
          description: INVALID_HEADER, INVALID_CURSOR
          x-error-codes:
            - INVALID_HEADER
            - INVALID_CURSOR
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
