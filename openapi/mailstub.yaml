components:
  headers:
    CacheControl:
      description: Responses must not be cached.
      schema:
        type: string
        enum:
          - no-store
    IdempotencyReplayed:
      description: true only for a replay of the saved original status and body.
      schema:
        type: boolean
    RequestId:
      description: Identifier of this HTTP attempt. Replays retain the original body request_id.
      schema:
        $ref: ./components/identifiers.yaml#/components/schemas/RequestId
    RetryAfter:
      description: Retry after one second for an in-flight command.
      schema:
        type: integer
        enum:
          - 1
  schemas:
    ApiError:
      $ref: ./components/errors.yaml#/components/schemas/ApiError
    MessageRequest:
      type: object
      additionalProperties: false
      required:
        - to
        - subject
        - text
      properties:
        to:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          minLength: 1
        text:
          type: string
          maxLength: 262144
          description: >-
            Plain text only; never interpreted as HTML. The total UTF-8 request body is also limited to 262144
            bytes.
    DeliveryReceipt:
      type: object
      additionalProperties: false
      required:
        - id
        - accepted_at
      properties:
        id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        accepted_at:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
    MailDemoAction:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action
      properties:
        action_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        action:
          type: string
          enum:
            - drop_next_response_after_accept
    MailDemoResult:
      type: object
      additionalProperties: false
      required:
        - action_id
        - server_time
      properties:
        action_id:
          $ref: ./components/identifiers.yaml#/components/schemas/CommandId
        server_time:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
    MessageSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - to
        - subject
        - accepted_at
      properties:
        id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        to:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
        accepted_at:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
    Message:
      type: object
      additionalProperties: false
      required:
        - id
        - to
        - subject
        - accepted_at
        - text
      properties:
        id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        to:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
        accepted_at:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
        text:
          type: string
    MessageCollection:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageSummary'
        next_cursor:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          minLength: 1
          nullable: true
          description: Required; null on the last or empty page. Signed cursor; see Cursor.
  securitySchemes:
    DeliveryToken:
      type: http
      scheme: bearer
      description: mailstub_delivery_token
    MailDemoToken:
      type: http
      scheme: bearer
      description: mailstub_demo_token
