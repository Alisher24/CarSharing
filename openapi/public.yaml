  /api/v1/reservations/{id}/cancel:
    post:
      operationId: cancelRental
      summary: cancel Rental
      x-implementation-status: implemented
      x-body-limit: 65536
      description: >-
        Give a reservation back before its deadline, free of charge and with no billable interval and no
        invoice. The owner comes from the session: an unknown identifier and another account's identifier are
        both 404 RESOURCE_NOT_FOUND. The deadline is compared with the authoritative moment the transaction
        fixed after its waits: before it the reservation becomes cancelled, and at or after it the expiry
        transition is recorded first and 409 RESERVATION_EXPIRED answers after that record is committed, so a
        domain refusal never rolls back a transition that had already become due. A cancellation does not
        return the daily limit. On 409 reread the authoritative current snapshot. Idempotency scope is the
        current user; fingerprint is method, normalized path including resource ID and canonical body.
        Missing key: 400 IDEMPOTENCY_KEY_REQUIRED; invalid UUID v4: 400 IDEMPOTENCY_KEY_INVALID. Same key
        with a different fingerprint: 409 IDEMPOTENCY_CONFLICT. Concurrent request: 409
        IDEMPOTENCY_IN_PROGRESS and Retry-After 1, which is not the moment the daily limit returns. Replay
        returns original status/body, server_time and body request_id with Idempotency-Replayed true and a
        new X-Request-ID for this attempt. Retain successes and checked domain failures for at least 24
        hours; exclude auth, validation, in-flight and technical rollbacks. Cleanup cannot remove
        invoice/payment uniqueness. No request body is permitted, including an empty JSON object.
