  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: logout
      x-implementation-status: implemented
      x-body-limit: 65536
      description: >-
        Naturally idempotent: clear cookie and return 204 when the session is absent or expired. Origin is
        still checked. For an existing session CSRF is required. Session cookie carsharing_session is
        HttpOnly, Path=/, SameSite=Lax, with an absolute 12-hour lifetime and no sliding renewal. Secure is
        required over HTTPS and disabled only for local HTTP. The session token is never in JSON. Origin is
        checked on browser mutations; authenticated mutations also check X-CSRF-Token. No request body is
        permitted, including an empty JSON object.
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            $ref: ./components/identifiers.yaml#/components/schemas/RequestId
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must match an allowed browser origin. Rejection is 403 ORIGIN_NOT_ALLOWED.
        - name: X-CSRF-Token
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 256
          description: Bound to the session; expires no later than the session. Rejection is 403 CSRF_INVALID.
      responses:
        '204':
          description: Session cleared, even if already absent. No response body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '400':
          description: INVALID_HEADER
          x-error-codes:
            - INVALID_HEADER
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVALID_HEADER:
                  value:
                    code: INVALID_HEADER
                    message: Request could not be completed
                    request_id: example-request-1
        '403':
          description: ORIGIN_NOT_ALLOWED, CSRF_INVALID
          x-error-codes:
            - ORIGIN_NOT_ALLOWED
            - CSRF_INVALID
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                ORIGIN_NOT_ALLOWED:
                  value:
                    code: ORIGIN_NOT_ALLOWED
                    message: Request could not be completed
                    request_id: example-request-1
                CSRF_INVALID:
                  value:
                    code: CSRF_INVALID
                    message: Request could not be completed
                    request_id: example-request-1
        '413':
          description: BODY_TOO_LARGE
          x-error-codes:
            - BODY_TOO_LARGE
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                BODY_TOO_LARGE:
                  value:
                    code: BODY_TOO_LARGE
                    message: Request could not be completed
                    request_id: example-request-1
        '422':
          description: VALIDATION_FAILED
          x-error-codes:
            - VALIDATION_FAILED
          headers:
            X-Request-ID:
