openapi: 3.0.3
info:
  title: CarSharing browser API
  version: 1.0.0
  description: >-
    MVP contract. Every operation states through x-implementation-status whether this application serves
    it; an operation that is still planned is not routed and answers as an unknown resource rather than as
    a method that exists. All JSON and SSE responses use Cache-Control no-store. Public JSON bodies are
    limited to 65536 bytes. Unsupported methods are 405 METHOD_NOT_ALLOWED with Allow; unknown/foreign
    resources and unimplemented production paths are 404 RESOURCE_NOT_FOUND. Errors use ApiError,
    X-Request-ID and no-store. Syntax/header errors are 400; parsed field errors are 422. Validation
    details enumerate all independently detectable violations in deterministic body/query/path/header and
    pointer/parameter order.
paths:
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      x-implementation-status: implemented
      summary: Check the process without querying dependencies
      responses:
        '200':
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStatus'
              example:
                status: ok
                server_time: '2026-09-12T07:15:30.123456Z'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '400':
          description: INVALID_HEADER
          x-error-codes:
            - INVALID_HEADER
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVALID_HEADER:
                  value:
                    code: INVALID_HEADER
                    message: Request could not be completed
                    request_id: example-request-1
        '413':
          description: BODY_TOO_LARGE
          x-error-codes:
            - BODY_TOO_LARGE
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                BODY_TOO_LARGE:
                  value:
                    code: BODY_TOO_LARGE
                    message: Request could not be completed
                    request_id: example-request-1
        '422':
          description: VALIDATION_FAILED
          x-error-codes:
            - VALIDATION_FAILED
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                VALIDATION_FAILED:
                  value:
                    code: VALIDATION_FAILED
                    message: Request could not be completed
                    request_id: example-request-1
                    details:
                      violations:
                        - location: body
                          pointer: /email
                          code: required
                          message: Required value is missing
        '500':
          description: INTERNAL_ERROR
          x-error-codes:
            - INTERNAL_ERROR
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INTERNAL_ERROR:
                  value:
                    code: INTERNAL_ERROR
                    message: Request could not be completed
                    request_id: example-request-1
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            $ref: ./components/identifiers.yaml#/components/schemas/RequestId
      x-body-limit: 65536
