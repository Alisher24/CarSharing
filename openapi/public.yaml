  /api/v1/reservations:
    post:
      operationId: reserve
      summary: reserve
      x-implementation-status: implemented
      x-body-limit: 65536
      description: >-
        Reserve one vehicle for 15 free minutes, measured between the stored reserved moment and the stored
        deadline. Server chooses immutable tariff conditions and the moment; reject all client-supplied time,
        owner, state, rates, energy and amount. One free reservation per account per service-timezone
        calendar day, across the whole fleet, all sessions and all devices, spent when the reservation is
        committed and never returned by a cancellation, an expiry or a later ride; an exhausted allowance is
        409 DAILY_LIMIT_REACHED with the typed moment it is restored. A vehicle the person or the vehicle
        already holds a live rental for is 409 ACTIVE_RENTAL_EXISTS or 409 VEHICLE_UNAVAILABLE, and a vehicle
        that fails the catalog rules is 409 VEHICLE_UNAVAILABLE with the reasons. Idempotency scope is the
        current user; fingerprint is method, normalized path including resource ID and canonical body.
        Missing key: 400 IDEMPOTENCY_KEY_REQUIRED; invalid UUID v4: 400 IDEMPOTENCY_KEY_INVALID. Same key
        with a different fingerprint: 409 IDEMPOTENCY_CONFLICT. Concurrent request: 409
        IDEMPOTENCY_IN_PROGRESS and Retry-After 1, which is not the moment the daily limit returns. Replay
        returns original status/body, server_time and body request_id with Idempotency-Replayed true and a
        new X-Request-ID for this attempt. Retain successes and checked domain failures for at least 24
        hours; exclude auth, validation, in-flight and technical rollbacks. Cleanup cannot remove
        invoice/payment uniqueness. Request body is required.
