  /api/v1/events:
    get:
      operationId: getPublicEvents
      summary: get Public Events
      x-implementation-status: implemented
      x-body-limit: 65536
      description: >-
        Ephemeral invalidation signal, not a log. Subscribe then send retry 3000 and ready with server_time.
        Heartbeat is a keepalive comment every 15 seconds. No SSE id, Last-Event-ID or replay support. Payload
        is only resource id/version, never full objects or private data. Compare versions within
        (resource,id), ignore equal/older. Start the primary REST snapshot immediately: waiting for ready must
        not block the map while REST answers. After every ready, including a reconnect, re-read the available
        REST resources, and reconcile vehicles together with the loaded zones and tariffs every five seconds. A
        signal that arrives during a request is remembered as the highest version seen for its resource and
        forces one more read when the answer does not contain it yet; the signalled version is never treated as
        a loaded object. Signals are coalesced over a 100 ms window, so a batch of vehicle changes costs one
        catalog read. A response started earlier never rolls a newer version back. A bounded-queue overflow
        closes the stream and the client recovers through a snapshot. Events: vehicle.changed, zone.changed,
        tariff.changed. Anonymous public resources only. No request body is permitted, including an empty JSON
        object.
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            $ref: ./components/identifiers.yaml#/components/schemas/RequestId
      responses:
        '200':
          description: SSE stream, no caching.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                vehicle.changed:
                  value: |+
                    retry: 3000
                    event: ready
                    data: {"server_time":"2026-09-12T07:15:30.123456Z"}

                    event: vehicle.changed
                    data: {"id":"01994342-6ba7-7000-8000-000000000001","version":"42"}

                    : keepalive

                zone.changed:
                  value: |+
                    retry: 3000
                    event: ready
                    data: {"server_time":"2026-09-12T07:15:30.123456Z"}

                    event: zone.changed
                    data: {"id":"01994342-6ba7-7000-8000-000000000001","version":"42"}

