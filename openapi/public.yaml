  /api/v1/me/current:
    get:
      operationId: getCurrentRental
      summary: get Current Rental
      x-implementation-status: implemented
      x-body-limit: 65536
      description: >-
        Always 200. Returns a live rental only: reserved, active or paused. A cancelled, expired or completed
        rental is never current, and with none of the three the answer states kind none. Both shapes carry
        server_time, the full current vehicle of the rental when there is one, and the daily-limit state with
        the moment it is restored, so a client displays the limit without inferring it from kind none. The
        read is not a pure projection: when it discovers a reservation past its deadline it records the
        expiry, releases the vehicle and writes the tasks of both changes before answering the fresh
        snapshot, with no worker running. An ordinary read with no due transition writes nothing. A failure
        to record the expiry is reported as a failure rather than as a confirmed absence of a rental. No
        request body is permitted, including an empty JSON object.
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            $ref: ./components/identifiers.yaml#/components/schemas/RequestId
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSnapshot'
              examples:
                none:
                  value:
                    kind: none
                    server_time: '2026-09-12T07:15:30.123456Z'
                    daily_limit:
                      available: false
                      resets_at: '2026-09-12T18:00:00.000000Z'
                rental:
