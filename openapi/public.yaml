components:
  headers:
    CacheControl:
      description: Responses must not be cached.
      schema:
        type: string
        enum:
          - no-store
    IdempotencyReplayed:
      description: true only for a replay of the saved original status and body.
      schema:
        type: boolean
    RequestId:
      description: Identifier of this HTTP attempt. Replays retain the original body request_id.
      schema:
        $ref: ./components/identifiers.yaml#/components/schemas/RequestId
    RetryAfter:
      description: Retry after one second for an in-flight command.
      schema:
        type: integer
        enum:
          - 1
    RetryAfterWait:
      description: >-
        Seconds to wait before a refused authentication attempt may be repeated. The value varies with the
        limit that was reached, unlike the fixed one-second Retry-After of an in-flight domain command.
      schema:
        type: integer
        minimum: 1
    SessionCookie:
      description: >-
        Session cookie carsharing_session is HttpOnly, Path=/, SameSite=Lax, with an absolute 12-hour lifetime
        and no sliding renewal. Secure is required over HTTPS and disabled only for local HTTP. The session
        token is never in JSON. Origin is checked on browser mutations; authenticated mutations also check
        X-CSRF-Token.
      schema:
        type: string
  schemas:
    ApiError:
      $ref: ./components/errors.yaml#/components/schemas/ApiError
    LiveStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - server_time
      properties:
        status:
          type: string
          enum:
            - ok
        server_time:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
    ReadyStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - city
        - currency
        - timezone
        - server_time
      properties:
        status:
          type: string
          enum:
            - ok
        city:
          type: string
          enum:
            - Бишкек
        currency:
          type: string
          enum:
            - KGS
        timezone:
          type: string
          enum:
            - Asia/Bishkek
        server_time:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
    ResourceId:
      $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
    CommandId:
      $ref: ./components/identifiers.yaml#/components/schemas/CommandId
    Timestamp:
      $ref: ./components/common.yaml#/components/schemas/Timestamp
    ExactInteger:
      $ref: ./components/common.yaml#/components/schemas/ExactInteger
    EnergyDecimal:
      $ref: ./components/common.yaml#/components/schemas/EnergyDecimal
    Cursor:
      $ref: ./components/common.yaml#/components/schemas/Cursor
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - created_at
      properties:
        id:
          $ref: ./components/identifiers.yaml#/components/schemas/ResourceId
        email:
          type: string
          format: email
          maxLength: 254
          description: Canonical email, trimmed and lowercased in full.
        created_at:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
    Credentials:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: >-
            Trim surrounding whitespace, lowercase the whole address, then validate the resulting email (at
            most 254 characters).
          pattern: ^\s*[^@\s]+@[^@\s]+\.[^@\s]+\s*$
        password:
          type: string
          minLength: 12
          maxLength: 128
          pattern: "^[^\t-\r \N\_  - \L\P  　]+$"
          description: 12–128 Unicode code points. No Unicode whitespace. Never trim or normalize.
    SessionSnapshot:
      type: object
      additionalProperties: false
      required:
        - server_time
        - user
        - csrf_token
        - session_expires_at
      properties:
        server_time:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          minLength: 1
          maxLength: 256
        session_expires_at:
          $ref: ./components/common.yaml#/components/schemas/Timestamp
    PowertrainType:
      type: string
      enum:
        - electric
        - gasoline
        - diesel
        - hybrid
        - gas
    SourceKind:
      type: string
      enum:
        - battery
        - gasoline
        - diesel
        - lpg
        - cng
    Position:
      type: array
      items:
        type: number
        format: double
        minimum: -180
        maximum: 180
