  /api/v1/auth/register:
    post:
      operationId: register
      summary: register
      x-implementation-status: implemented
      x-body-limit: 65536
      description: >-
        Register and immediately establish a session. Session cookie carsharing_session is HttpOnly, Path=/,
        SameSite=Lax, with an absolute 12-hour lifetime and no sliding renewal. Secure is required over HTTPS
        and disabled only for local HTTP. The session token is never in JSON. Origin is checked on browser
        mutations; authenticated mutations also check X-CSRF-Token. Request body is required.
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          schema:
            $ref: ./components/identifiers.yaml#/components/schemas/RequestId
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must match an allowed browser origin. Rejection is 403 ORIGIN_NOT_ALLOWED.
      responses:
        '201':
          description: Created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSnapshot'
              example:
                server_time: '2026-09-12T07:15:30.123456Z'
                user:
                  id: 01994342-6ba7-7000-8000-000000000001
                  email: user@example.test
                  created_at: '2026-09-12T07:15:30.123456Z'
                csrf_token: example-csrf-value
                session_expires_at: '2026-09-12T19:15:30.123456Z'
