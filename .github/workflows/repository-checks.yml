name: Repository checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0
  NPM_CONFIG_ENGINE_STRICT: "true"

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: sh scripts/install-gitleaks.sh
      - name: Check tracked paths and scan history
        run: sh scripts/check-secrets.sh history

  backend:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify modules
        working-directory: backend
        run: go mod verify
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        working-directory: backend
        run: go test ./...
      - name: Run static analysis
        working-directory: backend
        run: go vet ./...
      - name: Build packages and commands
        working-directory: backend
        run: go build ./...
      - name: Scan Go dependencies
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install formatting toolchain
        run: npm ci
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # The basemap is built during an image build, so what can be checked here is the declaration it
      # is built from: the header reader of the archive format, and the addresses, ranges and digests
      # the build and the interface both read.
      - name: Check the basemap declaration
        run: node --test "tools/basemap/*.test.mjs"
      - name: Check formatting
        run: npm run format:check
      - name: Lint stylesheets
        working-directory: frontend
        run: npm run lint:css
      - name: Check types
        working-directory: frontend
        run: npm run typecheck
      - name: Run unit tests
        working-directory: frontend
        run: npm test
      - name: Build application
        working-directory: frontend
        run: npm run build
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=low

  contracts:
    name: Contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/openapi/package-lock.json
      - name: Install contract dependencies
        working-directory: tools/openapi
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check generated contracts
        working-directory: tools/openapi
        run: npm run check
      - name: Audit contract dependencies
        working-directory: tools/openapi
        run: npm audit --audit-level=low

  integration:
    name: Compose integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RATE_LIMIT_SIGNIN_EMAIL_ADDRESS_ATTEMPTS: "10"
      RATE_LIMIT_SIGNIN_EMAIL_ATTEMPTS: "30"
      RATE_LIMIT_SIGNIN_ADDRESS_ATTEMPTS: "100"
      RATE_LIMIT_REGISTRATION_ADDRESS_ATTEMPTS: "10"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install browser checks toolchain
        run: npm ci
      - name: Install the browser the end-to-end checks drive
        run: npx playwright install --with-deps chromium
      - name: Create test configuration
        run: node scripts/setup.mjs
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start application
        run: docker compose up --build --detach
      - name: Run database and application smoke test
        run: node scripts/smoke.mjs
      # One suite at a time: the suites share one database, and some of them restart the API or
      # withdraw a privilege to observe a failure, which a concurrent suite would see as its own.
      - name: Run acceptance suites against the assembled stack
        run: node --test --test-concurrency=1 "scripts/acceptance/*.test.mjs"
      # The browser checks need two independent browser contexts, which no HTTP check can stand in
      # for. They run last so the suites above have left the demonstration in its prepared state.
      - name: Run browser acceptance against the assembled stack
        run: npm run e2e
      - name: Print service logs after failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail=200
      - name: Remove test application and data
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  repository-checks:
    name: Repository checks
    if: ${{ always() }}
    needs: [secrets, backend, frontend, contracts, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          printf '%s\n' \
            "secrets=$SECRETS_RESULT" \
            "backend=$BACKEND_RESULT" \
            "frontend=$FRONTEND_RESULT" \
            "contracts=$CONTRACTS_RESULT" \
            "integration=$INTEGRATION_RESULT"
          test "$SECRETS_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$CONTRACTS_RESULT" = success
          test "$INTEGRATION_RESULT" = success
